services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (see .env.example)}
      JWT_ISSUER: ${JWT_ISSUER:-tdt4290-backend}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-tdt4290-frontend}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in your .env file (see .env.example)}
      DATABASE_PATH: /app/data/app.db
      SVV_API_KEY: ${SVV_API_KEY:-}
      SVV_CACHE_TTL_DAYS: ${SVV_CACHE_TTL_DAYS:-14}
      APP_ENV: ${APP_ENV:-prod}
      ALLOW_DEV_PASSWORD_RESET_LOG: ${ALLOW_DEV_PASSWORD_RESET_LOG:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    # The data volume stays writable while the rest of the filesystem is read-only.
    volumes:
      - vehicle-backend-data:/app/data
    # Hardening: no privilege escalation, no Linux capabilities, read-only filesystem.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp # JVM scratch files (e.g. hsperfdata)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
        VITE_USE_MOCK_AUTH: ${VITE_USE_MOCK_AUTH:-false}
    environment:
      # Must match the origin of VITE_API_BASE_URL, or the CSP blocks API calls.
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8080}
    ports:
      - "3000:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # Owned by the nginx user (uid 101), since tmpfs mounts default to root.
    tmpfs:
      - /tmp:uid=101,gid=101 # nginx pid file and temp files
      - /var/cache/nginx:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101 # default.conf is rendered here from the template at startup
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vehicle-backend-data:
