# Fails if backend/gradle/wrapper/gradle-wrapper.jar isn't an official Gradle release. The jar is
# executed on every build (including inside Docker), so a swapped jar would run arbitrary code;
# distributionSha256Sum only protects the Gradle download, not the jar itself.
name: Gradle wrapper validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (tag in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
